name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy pandas matplotlib openpyxl antropy

      - name: Syntax check
        run: |
          python -m py_compile \
            analys_individual.py \
            analys_group.py \
            modules/hrvanalysis.py \
            modules/html_report_builder.py

      - name: Import check
        run: |
          python -c "import analys_individual, analys_group, modules.hrvanalysis, modules.html_report_builder; print('imports OK')"

      - name: Smoke test — analysis engine (synthetic data, no file IO)
        run: |
          python - <<'PY'
          import numpy as np
          from modules.hrvanalysis import compute_all_hrv_features, remove_outliers_moving_average
          rng = np.random.default_rng(0)
          rr = np.clip(rng.normal(800, 50, 2000), 400, 1600)
          rr = remove_outliers_moving_average(rr, 5, 3.0)[0]
          feats = compute_all_hrv_features(rr)
          for k in ("vlf_ms2", "lf_ms2", "hf_ms2", "lf_hf_ratio",
                    "lf_norm", "hf_norm", "sample_entropy", "dfa_alpha1"):
              assert k in feats, f"missing {k}"
          print("engine OK:", {k: round(feats[k], 3) for k in ("lf_ms2", "hf_ms2", "lf_hf_ratio", "sample_entropy")})
          PY

  build:
    name: Build executable (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            sep: ":"
            ext: ""
          - os: windows-latest
            sep: ";"
            ext: ".exe"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy pandas matplotlib openpyxl antropy pyinstaller

      - name: Build executable
        run: pyinstaller --clean --onefile --paths="${{ github.workspace }}" --hidden-import=modules.hrvanalysis --hidden-import=modules.html_report_builder --collect-submodules=modules --add-data "modules/hrv_norms.json${{ matrix.sep }}modules" --name "adHRV" analys_individual.py

      - name: Launch check (no file IO)
        run: ./dist/adHRV${{ matrix.ext }} --help

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: adHRV-${{ matrix.os }}
          path: dist/adHRV${{ matrix.ext }}
